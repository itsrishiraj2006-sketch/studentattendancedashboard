<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Reports - Student Attendance Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="logo-text">
        <h2>EduTrack</h2>
        <span>Attendance System</span>
      </div>
    </div>
    <ul class="nav-menu">
      <li class="nav-item"><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
      <li class="nav-item"><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>
      <li class="nav-item"><a href="attendance.html"><i class="fa-solid fa-clipboard-user"></i> Attendance</a></li>
      <li class="nav-item"><a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
      <li class="nav-item active"><a href="reports.html"><i class="fa-solid fa-file-invoice"></i> Reports</a></li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-navbar">
      <div class="nav-left">
        <button class="mobile-toggle" id="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
        <div class="page-title">
          <h1>Attendance Reports</h1>
          <p>Export & Print Custom Academic Attendance Records</p>
        </div>
      </div>
      <div class="nav-right">
        <div class="user-profile">
          <div class="avatar">AD</div>
          <div class="user-info">
            <div class="user-name">Dr. Rajesh Sharma</div>
            <div class="user-role">Faculty / HOD CSE</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-container">

      <!-- Report Filters & Controls Bar -->
      <div class="filter-bar">
        <div class="filter-controls">
          <div class="filter-group">
            <label>Report Type *</label>
            <select id="report-type">
              <option value="student">Student Attendance Report</option>
              <option value="subject">Subject Attendance Report</option>
              <option value="class">Class Attendance Report</option>
              <option value="date">Date-wise Attendance Report</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Class</label>
            <select id="report-class">
              <option value="All">All Classes</option>
              <option value="2A">Class 2A</option>
              <option value="2B">Class 2B</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Division</label>
            <select id="report-division">
              <option value="All">All Divisions</option>
              <option value="D1">Division D1</option>
              <option value="D2">Division D2</option>
            </select>
          </div>
        </div>

        <div style="display:flex;gap:10px;">
          <button class="btn btn-secondary" id="btn-export-csv"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
          <button class="btn btn-primary" id="btn-print-report"><i class="fa-solid fa-print"></i> Print Report</button>
        </div>
      </div>

      <!-- Report Table Card -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title">
            <h3 id="report-title-heading">Student Attendance Report</h3>
            <p style="font-size:12px;color:var(--text-muted);margin-top:2px;" id="report-generated-timestamp"></p>
          </div>
        </div>
        <div class="table-responsive">
          <table id="report-table">
            <thead id="report-table-head">
              <!-- Rendered via JS -->
            </thead>
            <tbody id="report-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/reports.js?v=2"></script>
</body>
</html>
